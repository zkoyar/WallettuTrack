name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: wallettutrack-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_VOLUME_NAME: wallettutrack-ci-data-${{ github.run_id }}-${{ github.run_attempt }}
      APP_IMAGE_NAME: wallettutrack-ci-app-${{ github.run_id }}
      MIGRATE_IMAGE_NAME: wallettutrack-ci-migrate-${{ github.run_id }}
      APP_VERSION: ci-${{ github.sha }}
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_CODE_URL: https://github.com/${{ github.repository }}
      MYSQL_ROOT_PASSWORD: ci-root-password-at-least-32-characters
      MYSQL_DATABASE: wallettutrack
      MYSQL_APP_USER: wallettutrack_app
      MYSQL_APP_PASSWORD: ci-app-password-at-least-32-characters
      MYSQL_BIND_ADDRESS: 127.0.0.1
      MYSQL_PORT: 33306
      APP_PORT: 3001
      DATABASE_URL: mysql://wallettutrack_app:ci-app-password-at-least-32-characters@127.0.0.1:33306/wallettutrack
      AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3001
      DEPLOYMENT_VISIBILITY: private
      REGISTRATION_MODE: first-user
      ALLOW_PUBLIC_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run security:audit
      - run: npm run build
      - name: Prepare isolated Docker storage and validate Compose
        shell: bash
        run: |
          docker volume create "$MYSQL_VOLUME_NAME"
          docker compose config --quiet
      - name: Build production containers
        run: docker compose build --pull app migrate
      - name: Start the production stack
        shell: bash
        run: |
          docker compose up -d
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              docker compose ps
              docker compose logs --tail 200
              exit 1
            fi
            sleep 2
          done
          test "$(docker compose exec -T app id -u)" = "1001"
          test "$(docker image inspect --format '{{.Config.User}}' "$MIGRATE_IMAGE_NAME:$APP_VERSION")" = "node"
      - name: Run end-to-end QA against the production image
        run: node scripts/qa.mjs http://127.0.0.1:3001
      - name: Verify database restart recovery
        shell: bash
        run: |
          docker compose restart mysql
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail 200 mysql app
          exit 1
      - name: Verify backup and destructive restore recovery
        shell: bash
        run: |
          backup_dir="$RUNNER_TEMP/database-backups"
          safety_dir="$RUNNER_TEMP/safety-backups"
          sh scripts/backup-db.sh "$backup_dir"
          backup_file=$(find "$backup_dir" -maxdepth 1 -type f -name 'wallettutrack-*.sql.gz' | head -n 1)
          test -n "$backup_file"
          test -f "$backup_file.sha256"

          unchecked_backup="$RUNNER_TEMP/unchecked-backup.sql.gz"
          cp "$backup_file" "$unchecked_backup"
          if CONFIRM=RESTORE SKIP_SAFETY_BACKUP=true sh scripts/restore-db.sh "$unchecked_backup"; then
            echo "Restore unexpectedly accepted a backup without its checksum." >&2
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null

          mysql_id=$(docker compose ps -q mysql)
          docker exec "$mysql_id" sh -lc \
            'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --user=root "$MYSQL_DATABASE" --execute "CREATE TABLE restore_only_probe (id INT PRIMARY KEY); INSERT INTO restore_only_probe VALUES (1);"'

          CONFIRM=RESTORE SAFETY_BACKUP_DIR="$safety_dir" \
            sh scripts/restore-db.sh "$backup_file"

          probe_count=$(docker exec "$mysql_id" sh -lc \
            'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --user=root --batch --skip-column-names --execute "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = \"$MYSQL_DATABASE\" AND table_name = \"restore_only_probe\";"')
          test "$probe_count" = "0"
          safety_backup=$(find "$safety_dir" -maxdepth 1 -type f -name 'wallettutrack-*.sql.gz' | head -n 1)
          test -n "$safety_backup"
          test -f "$safety_backup.sha256"
          docker exec "$mysql_id" sh -lc \
            'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --user=root "$MYSQL_DATABASE" --execute "DELETE FROM RateLimitBucket;"'

          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 90 ]; then
              docker compose ps
              docker compose logs --tail 200
              exit 1
            fi
            sleep 2
          done
          node scripts/qa.mjs http://127.0.0.1:3001
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail 300
      - name: Remove isolated CI stack
        if: always()
        shell: bash
        run: |
          docker compose down --remove-orphans || true
          docker volume rm "$MYSQL_VOLUME_NAME" || true
